name: Propuesta de mejora
description: Una idea o función nueva para FOMT Studio
title: "[Mejora] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qué problema resuelve
      description: Qué quieres hacer hoy y no puedes, o qué resulta incómodo.
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Propuesta
      description: Cómo te imaginas la solución.
    validations:
      required: true
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de cambio
      options:
        - Solo interfaz (textos, idiomas, temas, usabilidad)
        - Toca la lectura o escritura de la ROM
        - No lo sé
    validations:
      required: true
  - type: textarea
    id: referencias
    attributes:
      label: Referencias
      description: Offsets, funciones de la decompilación, capturas u otras herramientas que ya lo hagan.
